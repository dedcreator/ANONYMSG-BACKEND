services:
  # Backend Web Service
  - type: web
    name: anonq-backend
    runtime: python
    region: frankfurt # or oregon / ohio
    plan: free
    branch: main
    buildCommand: ./build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT anonmsg_backend.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: anonq-database
          property: connectionString
      - key: FRONTEND_URL
        value: "https://use-anonymsg.vercel.app"

databases:
  # Managed PostgreSQL Database
  - name: anonq-database
    databaseName: anonq_db
    user: anonq_user
    plan: free
    region: frankfurt
